name: Build MehediCapture APK

on:
  push:
    branches: [ main, master, dev ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17 (v5 — no deprecation warning)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Setup Gradle (handles wrapper + caching; no gradle-wrapper.jar needed)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 5. Build DEBUG APK
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 6. Build RELEASE APK
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # 7. Sign release APK
      #    FIX: secrets.* not allowed in if-expressions — expose via env then check env
      - name: Sign release APK
        if: github.event_name != 'pull_request' && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias:            ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword:      ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      # 8. Upload debug APK
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MehediCapture-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 9. Upload release APK (unsigned)
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MehediCapture-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # 10. Upload signed APK (only if signing ran)
      - name: Upload signed release APK
        if: steps.sign_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MehediCapture-release-signed-${{ github.sha }}
          path: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          retention-days: 90

  # ─────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK (if keys present)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: r0adkll/sign-android-release@v1
        id: sign_release
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias:            ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword:      ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Mehedi Capture ${{ github.ref_name }}"
          body: |
            ## Mehedi Capture ${{ github.ref_name }}

            **Free Fire packet capture + decoder for Android**

            ### Features
            - VPN-based capture (no root needed)
            - AES decrypt (static + session key)
            - Protobuf decode with deep scan
            - Edit & resend TCP/UDP packets
            - Varint / ZigZag encoder/decoder
            - build_mark_info() packet builder
            - JSON export (HTTP / TCP / UDP / All)

            ### APK
            Install the APK below. Enable "Unknown sources" in Android settings.
          files: |
            app/build/outputs/apk/release/*.apk
            ${{ steps.sign_release.outputs.signedReleaseFile }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
